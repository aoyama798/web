<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>病人信息收集</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    form { margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; width: 300px; border-radius: 8px; }
    label { display: block; margin: 8px 0 4px; }
    input { width: 95%; padding: 6px; margin-bottom: 10px; }
    button { padding: 8px 16px; border: none; background: #4CAF50; color: white; cursor: pointer; border-radius: 5px; }
    button:hover { background: #45a049; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #aaa; padding: 8px; text-align: center; }
    th { background-color: #f2f2f2; }
    .delete-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>

<h2>病人信息收集</h2>
<form id="patientForm">
  <label for="bed">床号:</label>
  <input type="text" id="bed" required>

  <label for="admitDate">入院日期:</label>
  <input type="date" id="admitDate" required>

  <label for="dischargeDate">出院日期:</label>
  <input type="date" id="dischargeDate">

  <button type="submit">添加</button>
</form>

<h3>汇总列表</h3>
<table>
  <thead>
    <tr>
      <th>床号</th>
      <th>入院日期</th>
      <th>出院日期</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody id="patientList"></tbody>
</table>

<!-- Firebase (使用 v10 模块化写法) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
  import { getFirestore, collection, addDoc, deleteDoc, doc as firestoreDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

  // ⚠️ 替换成你自己的 firebaseConfig
  const firebaseConfig = {
    apiKey: "你的APIKEY",
    authDomain: "xxx.firebaseapp.com",
    projectId: "xxx",
    storageBucket: "xxx.appspot.com",
    messagingSenderId: "xxx",
    appId: "xxx"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const form = document.getElementById('patientForm');
  const patientList = document.getElementById('patientList');

  // 添加数据
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const bed = document.getElementById('bed').value;
    const admitDate = document.getElementById('admitDate').value;
    const dischargeDate = document.getElementById('dischargeDate').value;

    await addDoc(collection(db, "patients"), {
      bed,
      admitDate,
      dischargeDate
    });

    form.reset();
  });

  // 监听数据库
  onSnapshot(collection(db, "patients"), (snapshot) => {
    patientList.innerHTML = ""; // 清空表格
    snapshot.forEach((snap) => {
      const data = snap.data();
      const row = patientList.insertRow();
      row.insertCell(0).textContent = data.bed;
      row.insertCell(1).textContent = data.admitDate;
      row.insertCell(2).textContent = data.dischargeDate;

      // 删除按钮
      const delCell = row.insertCell(3);
      const btn = document.createElement("button");
      btn.textContent = "删除";
      btn.className = "delete-btn";
      btn.onclick = async () => {
        await deleteDoc(firestoreDoc(db, "patients", snap.id));
      };
      delCell.appendChild(btn);
    });
  });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>病人出院提醒系统</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            margin-bottom: 20px;
        }
        input {
            margin-right: 10px;
            padding: 5px;
        }
        button {
            padding: 5px 10px;
        }
        #patientList {
            margin-top: 20px;
        }
        .patient {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
        .reminder {
            color: red;
            font-weight: bold;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"></script>
</head>
<body>
    <h1>病人信息录入</h1>
    <form id="patientForm">
        <label for="bedNumber">床号:</label>
        <input type="text" id="bedNumber" required>
        
        <label for="name">姓名:</label>
        <input type="text" id="name" required>
        
        <label for="dischargeDate">出院日期:</label>
        <input type="date" id="dischargeDate" required>
        
        <button type="submit">录入</button>
    </form>
    
    <h2>未来需要提醒的病人</h2>
    <div id="patientList"></div>
    
    <script>
        // Initialize Firebase
        const firebaseConfig = {
            // 替换为你的 Firebase 配置
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 添加病人
        document.getElementById('patientForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const bedNumber = document.getElementById('bedNumber').value;
            const name = document.getElementById('name').value;
            const dischargeDate = document.getElementById('dischargeDate').value;
            
            if (!bedNumber || !name || !dischargeDate) return;
            
            try {
                await db.collection('patients').add({
                    bedNumber,
                    name,
                    dischargeDate,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // 清空表单
                document.getElementById('bedNumber').value = '';
                document.getElementById('name').value = '';
                document.getElementById('dischargeDate').value = '';
                
                renderPatients();
            } catch (error) {
                console.error('Error adding patient:', error);
                alert('录入失败，请重试！');
            }
        });
        
        // 渲染未来需要提醒的病人
        async function renderPatients() {
            const list = document.getElementById('patientList');
            list.innerHTML = '';
            
            const today = new Date();
            today.setHours(0, 0, 0, 0); // 今天零时
            
            try {
                const snapshot = await db.collection('patients')
                    .orderBy('dischargeDate', 'asc')
                    .get();
                
                snapshot.forEach(doc => {
                    const patient = doc.data();
                    const discharge = new Date(patient.dischargeDate);
                    discharge.setHours(0, 0, 0, 0);
                    
                    const twoDaysAfter = new Date(discharge);
                    twoDaysAfter.setDate(twoDaysAfter.getDate() + 2);
                    
                    // 只显示未来需要提醒的病人（出院日期当天或出院后2天，且日期未过期）
                    if (discharge >= today) {
                        let reminder = '';
                        if (today.getTime() === discharge.getTime()) {
                            reminder = '（提醒：提交首页）';
                        } else if (today.getTime() === twoDaysAfter.getTime()) {
                            reminder = '（提醒：提交病案）';
                        } else if (discharge > today) {
                            reminder = `（待提醒：${patient.dischargeDate} 提交首页）`;
                        }
                        
                        const div = document.createElement('div');
                        div.className = 'patient';
                        div.innerHTML = `
                            <p>床号: ${patient.bedNumber}</p>
                            <p>姓名: ${patient.name}</p>
                            <p>出院日期: ${patient.dischargeDate}</p>
                            <p class="reminder">${reminder}</p>
                            <button onclick="deletePatient('${doc.id}')">删除</button>
                        `;
                        list.appendChild(div);
                    }
                });
            } catch (error) {
                console.error('Error fetching patients:', error);
                alert('获取病人数据失败，请重试！');
            }
        }
        
        // 删除病人
        async function deletePatient(docId) {
            try {
                await db.collection('patients').doc(docId).delete();
                renderPatients();
            } catch (error) {
                console.error('Error deleting patient:', error);
                alert('删除失败，请重试！');
            }
        }
        
        // 页面加载时渲染
        window.addEventListener('load', renderPatients);
        
        // 页面加载时弹出警报
        window.addEventListener('load', async function() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            let alerts = [];
            try {
                const snapshot = await db.collection('patients').get();
                snapshot.forEach(doc => {
                    const patient = doc.data();
                    const discharge = new Date(patient.dischargeDate);
                    discharge.setHours(0, 0, 0, 0);
                    
                    const twoDaysAfter = new Date(discharge);
                    twoDaysAfter.setDate(twoDaysAfter.getDate() + 2);
                    
                    if (today.getTime() === discharge.getTime()) {
                        alerts.push(`病人 ${patient.name} (床号: ${patient.bedNumber})：提交首页`);
                    } else if (today.getTime() === twoDaysAfter.getTime()) {
                        alerts.push(`病人 ${patient.name} (床号: ${patient.bedNumber})：提交病案`);
                    }
                });
                
                if (alerts.length > 0) {
                    alert(alerts.join('\n'));
                }
            } catch (error) {
                console.error('Error checking reminders:', error);
            }
        });
    </script>
</body>
</html>
